<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIDEBREAK</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#020814;color:#dff2ff;font-family:'VT323',monospace;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px;}
  h1{font-family:'Press Start 2P',cursive;color:#fff;font-size:1.2rem;
    text-shadow:0 0 8px #3bb0ff,0 0 20px #3bb0ff;letter-spacing:2px;}
  #hud{display:flex;gap:30px;font-size:1.3rem;color:#ffe14d;margin-bottom:10px;}
  canvas{background:#04101f;border:2px solid #3bb0ff;box-shadow:0 0 24px rgba(59,176,255,.35);}
  #msg{font-size:1.2rem;color:#ffe14d;margin-top:10px;text-align:center;max-width:600px;}
  #overlay{position:fixed;inset:0;background:rgba(2,8,20,.94);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;text-align:center;z-index:5;}
  #overlay h2{font-family:'Press Start 2P',cursive;color:#3bb0ff;font-size:1.1rem;}
  button{font-family:'Press Start 2P',cursive;font-size:.7rem;background:#ffe14d;color:#04000a;
    border:none;padding:14px 20px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.5);}
  a.back{color:#00fff2;font-size:1.1rem;text-decoration:none;margin-top:6px;}
</style>
</head>
<body>
<h1>TIDEBREAK</h1>
<div id="hud"><span>CARGO: <span id="cargo">0</span></span><span>BEST: <span id="best">0</span></span></div>
<canvas id="c" width="600" height="380"></canvas>
<div id="msg">← → shift ballast to counter the tilt · catch falling crates without capsizing</div>
<div id="overlay">
  <h2>TIDEBREAK</h2>
  <p style="max-width:440px;">A supply boat, open water, crates raining down.<br>
  Shift your ballast to keep the deck level, catch every crate you can — but stack it wrong and you go under.</p>
  <button id="startBtn">SET SAIL ▶</button>
  <a class="back" href="index.html">← back to arcade</a>
</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const waterY=H-70;
let tilt=0, tiltVel=0, ballast=0, cargo=0, best=+(localStorage.getItem('tidebreak_best')||0), running=false, crates=[], spawnTimer=0, waveT=0, keys={};
document.getElementById('best').textContent=best;

function reset(){
  tilt=0; tiltVel=0; ballast=0; cargo=0; crates=[]; spawnTimer=0; waveT=0;
  document.getElementById('cargo').textContent=cargo;
}

window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);

function spawnCrate(){
  crates.push({x: 80+Math.random()*(W-160), y:-10, speed:70+Math.random()*30, caught:false});
}

function update(dt){
  if(!running) return;
  waveT += dt;
  spawnTimer += dt;
  if(spawnTimer>1.6){ spawnTimer=0; spawnCrate(); }

  if(keys['ArrowLeft']) ballast -= 60*dt;
  if(keys['ArrowRight']) ballast += 60*dt;
  ballast = Math.max(-40,Math.min(40,ballast));

  const waveForce = Math.sin(waveT*1.3)*6;
  const targetTilt = ballast*0.6 + waveForce;
  tiltVel += (targetTilt - tilt)*0.02;
  tiltVel *= 0.9;
  tilt += tiltVel;

  crates.forEach(cr=>{ cr.y += cr.speed*dt; });

  const boatCx=W/2, boatY=waterY - 10;
  crates = crates.filter(cr=>{
    if(cr.caught) return false;
    if(cr.y > boatY-10 && cr.y < boatY+16){
      const deckX = boatCx + Math.tan(tilt*Math.PI/180)*(cr.x-boatCx);
      if(Math.abs(cr.x - boatCx) < 130){
        cargo++; document.getElementById('cargo').textContent=cargo;
        return false;
      }
    }
    if(cr.y > H+20) return false;
    return true;
  });

  if(Math.abs(tilt) > 35){
    running=false;
    if(cargo>best){ best=cargo; localStorage.setItem('tidebreak_best',best); document.getElementById('best').textContent=best; }
    document.getElementById('msg').textContent='CAPSIZED! Press R to set sail again.';
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#04101f'; ctx.fillRect(0,0,W,H);

  // water
  ctx.fillStyle='#08243f';
  ctx.fillRect(0,waterY,W,H-waterY);
  ctx.strokeStyle='rgba(59,176,255,0.4)';
  for(let x=0;x<W;x+=30){
    ctx.beginPath();
    ctx.moveTo(x, waterY+Math.sin((x+waveT*80)*0.05)*4);
    ctx.lineTo(x+15, waterY+Math.sin((x+15+waveT*80)*0.05)*4);
    ctx.stroke();
  }

  // boat
  ctx.save();
  ctx.translate(W/2, waterY-6);
  ctx.rotate(tilt*Math.PI/180);
  ctx.fillStyle='#3bb0ff'; ctx.shadowColor='#3bb0ff'; ctx.shadowBlur=10;
  ctx.beginPath();
  ctx.moveTo(-140,0); ctx.lineTo(140,0); ctx.lineTo(120,26); ctx.lineTo(-120,26); ctx.closePath();
  ctx.fill(); ctx.shadowBlur=0;
  // ballast indicator
  ctx.fillStyle='#ffe14d';
  ctx.fillRect(ballast*2-10, 6, 20, 10);
  ctx.restore();

  // crates
  crates.forEach(cr=>{
    ctx.fillStyle='#c98a3a'; ctx.strokeStyle='#7a4d1a'; ctx.lineWidth=2;
    ctx.fillRect(cr.x-10, cr.y-10, 20, 20);
    ctx.strokeRect(cr.x-10, cr.y-10, 20, 20);
  });

  // tilt meter
  ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(20,20,W-40,10);
  ctx.fillStyle= Math.abs(tilt)>25?'#ff3b5c':'#3bb0ff';
  ctx.fillRect(20+(W-40)/2 + tilt*3 - 4, 20, 8, 10);
  ctx.strokeStyle='#fff'; ctx.strokeRect(20,20,W-40,10);
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
window.addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'){ reset(); running=true; document.getElementById('msg').textContent='← → shift ballast to counter the tilt · catch falling crates'; }
});
document.getElementById('startBtn').addEventListener('click',()=>{
  document.getElementById('overlay').style.display='none';
  reset(); running=true;
});
requestAnimationFrame(loop);
</script>
</body>
</html>
