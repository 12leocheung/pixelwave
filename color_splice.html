<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COLOR SPLICE</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#05020c;color:#e9e2ff;font-family:'VT323',monospace;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px;}
  h1{font-family:'Press Start 2P',cursive;color:#fff;font-size:1.2rem;
    text-shadow:0 0 8px #a742ff,0 0 20px #a742ff;letter-spacing:2px;}
  #hud{display:flex;gap:30px;font-size:1.3rem;color:#00fff2;margin-bottom:10px;}
  canvas{background:#0a0518;border:2px solid #a742ff;box-shadow:0 0 24px rgba(167,66,255,.4);}
  #msg{font-size:1.2rem;color:#ffe14d;margin-top:10px;text-align:center;max-width:600px;}
  #overlay{position:fixed;inset:0;background:rgba(5,2,12,.94);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;text-align:center;z-index:5;}
  #overlay h2{font-family:'Press Start 2P',cursive;color:#a742ff;font-size:1.1rem;}
  button{font-family:'Press Start 2P',cursive;font-size:.7rem;background:#ffe14d;color:#04000a;
    border:none;padding:14px 20px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.5);}
  a.back{color:#00fff2;font-size:1.1rem;text-decoration:none;margin-top:6px;}
</style>
</head>
<body>
<h1>COLOR SPLICE</h1>
<div id="hud"><span>LEVEL: <span id="lvl">1</span></span><span>MOVES: <span id="moves">0</span></span></div>
<canvas id="c" width="480" height="480"></canvas>
<div id="msg">click a tile to rotate it 90° — route each beam from its emitter into the matching target</div>
<div id="overlay">
  <h2>COLOR SPLICE</h2>
  <p style="max-width:420px;">Light enters from the emitters at the edge.<br>Rotate the prism tiles so every beam reaches its color-matched target.</p>
  <button id="startBtn">SPLICE ▶</button>
  <a class="back" href="index.html">← back to arcade</a>
</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
let GRID=5, cell=W/GRID, level=1, moves=0;
let tiles=[]; // {type:'straight'|'corner'|'empty', rot:0..3}
let emitters=[]; // {r,c,dir,color}
let targets=[]; // {r,c,color, satisfied}
const COLORS={r:'#ff3b5c', g:'#39ff6a', b:'#3bb0ff', y:'#ffe14d'};
const DIRS=[{dr:-1,dc:0},{dr:0,dc:1},{dr:1,dc:0},{dr:0,dc:-1}]; // up right down left

function buildLevel(n){
  GRID = 5; cell=W/GRID; moves=0;
  document.getElementById('moves').textContent=moves;
  tiles=[];
  for(let r=0;r<GRID;r++){
    const row=[];
    for(let c=0;c<GRID;c++) row.push({type: Math.random()<0.15?'empty':(Math.random()<0.5?'straight':'corner'), rot: Math.floor(Math.random()*4)});
    tiles.push(row);
  }
  const colorKeys=Object.keys(COLORS);
  const pairCount = Math.min(2+Math.floor(n/2), 4);
  emitters=[]; targets=[];
  const used=new Set();
  const edgeSpots=[];
  for(let i=0;i<GRID;i++){ edgeSpots.push({r:0,c:i,dir:2}); edgeSpots.push({r:GRID-1,c:i,dir:0}); edgeSpots.push({r:i,c:0,dir:1}); edgeSpots.push({r:i,c:GRID-1,dir:3}); }
  for(let i=0;i<pairCount;i++){
    let e,t;
    do{ e=edgeSpots[Math.floor(Math.random()*edgeSpots.length)]; }while(used.has(e.r+'_'+e.c));
    used.add(e.r+'_'+e.c);
    do{ t=edgeSpots[Math.floor(Math.random()*edgeSpots.length)]; }while(used.has(t.r+'_'+t.c));
    used.add(t.r+'_'+t.c);
    const color=colorKeys[i%colorKeys.length];
    emitters.push({r:e.r,c:e.c,dir:e.dir,color});
    targets.push({r:t.r,c:t.c,color,hit:false});
    tiles[e.r][e.c]={type:'empty',rot:0};
    tiles[t.r][t.c]={type:'empty',rot:0};
  }
  document.getElementById('lvl').textContent=level;
}

function reset(){ level=1; buildLevel(level); }

// tile connectivity: which of 4 dirs (0up,1right,2down,3left) connect through, given type+rot
function connections(tile){
  if(tile.type==='empty') return [0,1,2,3]; // pass-through everywhere (acts as open cell)
  if(tile.type==='straight'){
    const base = (tile.rot%2===0) ? [0,2] : [1,3];
    return base;
  }
  if(tile.type==='corner'){
    const bases=[[0,1],[1,2],[2,3],[3,0]];
    return bases[tile.rot%4];
  }
  return [];
}
const OPP=[2,3,0,1];

function traceBeams(){
  targets.forEach(t=>t.hit=false);
  const beamPaths=[];
  emitters.forEach(e=>{
    let r=e.r,c=e.c,dir=e.dir;
    const path=[{r,c}];
    let steps=0;
    while(steps++<50){
      const nr=r+DIRS[dir].dr, nc=c+DIRS[dir].dc;
      if(nr<0||nr>=GRID||nc<0||nc>=GRID) break;
      const tile=tiles[nr][nc];
      const needed=OPP[dir];
      const conns=connections(tile);
      if(!conns.includes(needed)) break;
      let outDir;
      if(tile.type==='empty') outDir=dir;
      else outDir = conns[0]===needed ? conns[1] : conns[0];
      r=nr;c=nc;dir=outDir;
      path.push({r,c});
      const target=targets.find(t=>t.r===r&&t.c===c&&t.color===e.color);
      if(target){ target.hit=true; break; }
    }
    beamPaths.push({color:e.color, path});
  });
  return beamPaths;
}

function checkWin(beamPaths){
  if(targets.every(t=>t.hit)){
    setTimeout(()=>{
      level++;
      document.getElementById('msg').textContent='SPLICED! Loading next circuit...';
      setTimeout(()=>{ buildLevel(level); document.getElementById('msg').textContent='click a tile to rotate — route each beam to its target'; },900);
    },150);
  }
}

function draw(){
  const beamPaths=traceBeams();
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0a0518'; ctx.fillRect(0,0,W,H);

  for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){
    ctx.strokeStyle='rgba(167,66,255,0.25)';
    ctx.strokeRect(c*cell,r*cell,cell,cell);
    const tile=tiles[r][c];
    if(tile.type!=='empty'){
      ctx.save();
      ctx.translate(c*cell+cell/2, r*cell+cell/2);
      ctx.strokeStyle='rgba(0,255,242,0.55)'; ctx.lineWidth=4;
      const conns=connections(tile);
      conns.forEach(d=>{
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.lineTo(DIRS[d].dc*cell/2, DIRS[d].dr*cell/2);
        ctx.stroke();
      });
      ctx.restore();
    }
  }

  emitters.forEach(e=>{
    ctx.fillStyle=COLORS[e.color]; ctx.shadowColor=COLORS[e.color]; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(e.c*cell+cell/2, e.r*cell+cell/2, cell*0.22,0,7); ctx.fill();
    ctx.shadowBlur=0;
  });
  targets.forEach(t=>{
    ctx.strokeStyle=COLORS[t.color]; ctx.lineWidth= t.hit?6:3;
    ctx.shadowColor=COLORS[t.color]; ctx.shadowBlur= t.hit?18:0;
    ctx.beginPath(); ctx.arc(t.c*cell+cell/2, t.r*cell+cell/2, cell*0.28,0,7); ctx.stroke();
    ctx.shadowBlur=0;
  });

  beamPaths.forEach(bp=>{
    ctx.strokeStyle=COLORS[bp.color]; ctx.lineWidth=5; ctx.shadowColor=COLORS[bp.color]; ctx.shadowBlur=10;
    ctx.beginPath();
    bp.path.forEach((p,i)=>{
      const x=p.c*cell+cell/2, y=p.r*cell+cell/2;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke(); ctx.shadowBlur=0;
  });

  checkWin(beamPaths);
}

canvas.addEventListener('click',e=>{
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width), y=(e.clientY-rect.top)*(H/rect.height);
  const c=Math.floor(x/cell), r=Math.floor(y/cell);
  if(r<0||r>=GRID||c<0||c>=GRID) return;
  const tile=tiles[r][c];
  if(tile.type==='empty') return;
  tile.rot=(tile.rot+1)%4;
  moves++; document.getElementById('moves').textContent=moves;
});

function loop(){ draw(); requestAnimationFrame(loop); }
document.getElementById('startBtn').addEventListener('click',()=>{
  document.getElementById('overlay').style.display='none';
  reset();
});
reset();
loop();
</script>
</body>
</html>
