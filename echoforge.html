<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHOFORGE</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#140502;color:#ffe9d6;font-family:'VT323',monospace;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px;}
  h1{font-family:'Press Start 2P',cursive;color:#fff;font-size:1.2rem;
    text-shadow:0 0 8px #ff7a2b,0 0 20px #ff7a2b;letter-spacing:2px;}
  #hud{display:flex;gap:30px;font-size:1.3rem;color:#ffe14d;margin-bottom:10px;}
  canvas{background:#1c0904;border:2px solid #ff7a2b;box-shadow:0 0 24px rgba(255,122,43,.35);}
  #msg{font-size:1.2rem;color:#ffe14d;margin-top:10px;text-align:center;max-width:600px;}
  #overlay{position:fixed;inset:0;background:rgba(20,5,2,.94);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;text-align:center;z-index:5;}
  #overlay h2{font-family:'Press Start 2P',cursive;color:#ff7a2b;font-size:1.1rem;}
  button{font-family:'Press Start 2P',cursive;font-size:.7rem;background:#ffe14d;color:#04000a;
    border:none;padding:14px 20px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.5);}
  a.back{color:#00fff2;font-size:1.1rem;text-decoration:none;margin-top:6px;}
</style>
</head>
<body>
<h1>ECHOFORGE</h1>
<div id="hud"><span>SWORD: <span id="sword">1</span>/5</span><span>QUALITY: <span id="quality">100</span>%</span><span>COMBO: <span id="combo">0</span></span></div>
<canvas id="c" width="600" height="260"></canvas>
<div id="msg">press SPACE the instant the hammer marker crosses the hit-line</div>
<div id="overlay">
  <h2>ECHOFORGE</h2>
  <p style="max-width:440px;">Every great blade is struck on the beat.<br>
  Hit SPACE in rhythm as the marker sweeps across — forge 5 swords before your quality bottoms out.</p>
  <button id="startBtn">STRIKE ▶</button>
  <a class="back" href="index.html">← back to arcade</a>
</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const hitX=W/2;
let running=false, sword=1, quality=100, combo=0, bestCombo=0;
let markerX=0, markerSpeed=220, dir=1, hitsNeeded=10, hitsDone=0;

function reset(){
  sword=1; quality=100; combo=0; hitsDone=0; hitsNeeded=10; markerSpeed=220; markerX=0; dir=1;
  updateHud();
}
function updateHud(){
  document.getElementById('sword').textContent=sword;
  document.getElementById('quality').textContent=Math.max(0,Math.round(quality));
  document.getElementById('combo').textContent=combo;
}

function strike(){
  if(!running) return;
  const dist=Math.abs(markerX-hitX);
  if(dist<12){
    hitsDone++; combo++; quality=Math.min(100,quality+2);
  } else if(dist<28){
    hitsDone++; combo=0; quality=Math.max(0,quality-4);
  } else {
    combo=0; quality=Math.max(0,quality-10);
  }
  updateHud();
  if(quality<=0){
    running=false;
    document.getElementById('msg').textContent='THE BLADE CRACKED. Press R to reforge.';
    return;
  }
  if(hitsDone>=hitsNeeded){
    if(sword>=5){
      running=false;
      document.getElementById('msg').textContent='ALL 5 SWORDS FORGED! Final quality '+Math.round(quality)+'%. Press R to forge anew.';
    } else {
      sword++; hitsDone=0; hitsNeeded+=2; markerSpeed+=25;
      document.getElementById('msg').textContent='Sword '+ (sword-1) +' complete! Next blade heating up...';
      updateHud();
    }
  }
}

function update(dt){
  if(!running) return;
  markerX += dir*markerSpeed*dt;
  if(markerX>W-20){ markerX=W-20; dir=-1; }
  if(markerX<20){ markerX=20; dir=1; }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#1c0904'; ctx.fillRect(0,0,W,H);

  // anvil bar
  const barY=H/2;
  ctx.strokeStyle='rgba(255,122,43,0.35)'; ctx.lineWidth=8;
  ctx.beginPath(); ctx.moveTo(20,barY); ctx.lineTo(W-20,barY); ctx.stroke();

  // hit zones
  ctx.fillStyle='rgba(57,255,106,0.25)';
  ctx.fillRect(hitX-12, barY-20, 24, 40);
  ctx.fillStyle='rgba(255,225,77,0.18)';
  ctx.fillRect(hitX-28, barY-20, 16, 40);
  ctx.fillRect(hitX+12, barY-20, 16, 40);

  ctx.strokeStyle='#ffe14d'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(hitX,barY-30); ctx.lineTo(hitX,barY+30); ctx.stroke();

  // marker
  ctx.fillStyle='#ff7a2b'; ctx.shadowColor='#ff7a2b'; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.arc(markerX, barY, 10,0,7); ctx.fill(); ctx.shadowBlur=0;

  // progress
  ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(20,H-40,W-40,14);
  ctx.fillStyle='#ff7a2b';
  ctx.fillRect(20,H-40,(W-40)*(hitsDone/hitsNeeded),14);
  ctx.strokeStyle='#fff'; ctx.strokeRect(20,H-40,W-40,14);
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(!running && document.getElementById('overlay').style.display==='none'){ reset(); running=true; document.getElementById('msg').textContent='press SPACE the instant the hammer marker crosses the hit-line'; }
    else strike();
  }
  if(e.key==='r'||e.key==='R'){ reset(); running=true; document.getElementById('msg').textContent='press SPACE the instant the hammer marker crosses the hit-line'; }
});
document.getElementById('startBtn').addEventListener('click',()=>{
  document.getElementById('overlay').style.display='none';
  reset(); running=true;
});
requestAnimationFrame(loop);
</script>
</body>
</html>
