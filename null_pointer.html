<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NULL POINTER</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#000804;color:#8dffb0;font-family:'VT323',monospace;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px;}
  h1{font-family:'Press Start 2P',cursive;color:#39ff6a;font-size:1.2rem;
    text-shadow:0 0 8px #39ff6a,0 0 20px #39ff6a;letter-spacing:2px;}
  #hud{display:flex;gap:30px;font-size:1.3rem;color:#ffe14d;margin-bottom:10px;}
  canvas{background:#000f06;border:2px solid #39ff6a;box-shadow:0 0 24px rgba(57,255,106,.35);}
  #input{margin-top:14px;font-family:'VT323',monospace;font-size:1.4rem;background:#000f06;
    color:#39ff6a;border:2px solid #39ff6a;padding:8px 12px;width:400px;text-align:center;}
  #msg{font-size:1.2rem;color:#ffe14d;margin-top:10px;text-align:center;max-width:600px;}
  #overlay{position:fixed;inset:0;background:rgba(0,8,4,.95);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;text-align:center;z-index:5;}
  #overlay h2{font-family:'Press Start 2P',cursive;color:#39ff6a;font-size:1.1rem;}
  button{font-family:'Press Start 2P',cursive;font-size:.7rem;background:#ffe14d;color:#04000a;
    border:none;padding:14px 20px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.5);}
  a.back{color:#00fff2;font-size:1.1rem;text-decoration:none;margin-top:6px;}
</style>
</head>
<body>
<h1>NULL POINTER</h1>
<div id="hud"><span>FIREWALL: <span id="fw">100</span>%</span><span>CLEARED: <span id="cleared">0</span></span><span>BEST: <span id="best">0</span></span></div>
<canvas id="c" width="600" height="380"></canvas>
<input id="input" type="text" placeholder="type the falling snippet, press ENTER" autocomplete="off" disabled>
<div id="msg">type each falling line exactly and hit ENTER before it reaches the firewall</div>
<div id="overlay">
  <h2>NULL POINTER</h2>
  <p style="max-width:440px;">Code snippets are falling faster than you can review them.<br>
  Type each one exactly, hit enter, delete it before it slams into your firewall.</p>
  <button id="startBtn">COMPILE ▶</button>
  <a class="back" href="index.html">← back to arcade</a>
</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const SNIPPETS=[
  'const x = 42;','function run(){}','if(err) throw err;','return null;','let sum = 0;',
  'for(i=0;i<n;i++)','import os','print("hi")','while(true){}','x += 1;',
  'array.push(v)','def main():','class Node:','try { } catch(e){}','SELECT * FROM t',
  'malloc(sizeof(x))','free(ptr);','git commit -m fix','npm install','sudo rm -rf'
];
let words=[], fw=100, cleared=0, best=+(localStorage.getItem('nullpointer_best')||0), running=false, spawnTimer=0, spawnInterval=2.4, speed=28;
document.getElementById('best').textContent=best;
const input=document.getElementById('input');

function reset(){
  words=[]; fw=100; cleared=0; spawnTimer=0; spawnInterval=2.4; speed=28;
  document.getElementById('fw').textContent=fw;
  document.getElementById('cleared').textContent=cleared;
}

function spawnWord(){
  const text=SNIPPETS[Math.floor(Math.random()*SNIPPETS.length)];
  words.push({text, x: 20+Math.random()*(W-220), y:-10, speed: speed+Math.random()*10});
}

function update(dt){
  if(!running) return;
  spawnTimer+=dt;
  if(spawnTimer>spawnInterval){ spawnTimer=0; spawnWord(); if(spawnInterval>0.9) spawnInterval-=0.05; }
  words.forEach(w=>w.y += w.speed*dt);
  const before=words.length;
  words = words.filter(w=>{
    if(w.y > H-20){ fw -= 12; return false; }
    return true;
  });
  document.getElementById('fw').textContent=Math.max(0,Math.round(fw));
  if(fw<=0){
    running=false; input.disabled=true;
    if(cleared>best){ best=cleared; localStorage.setItem('nullpointer_best',best); document.getElementById('best').textContent=best; }
    document.getElementById('msg').textContent='FIREWALL BREACHED. Press ENTER key or the button to recompile.';
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#000f06'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(57,255,106,0.4)'; ctx.setLineDash([6,6]);
  ctx.beginPath(); ctx.moveTo(0,H-20); ctx.lineTo(W,H-20); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font='20px "VT323", monospace';
  words.forEach(w=>{
    ctx.fillStyle= '#39ff6a';
    ctx.shadowColor='#39ff6a'; ctx.shadowBlur=6;
    ctx.fillText(w.text, w.x, w.y);
    ctx.shadowBlur=0;
  });
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt); draw();
  requestAnimationFrame(loop);
}

input.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const val=input.value.trim();
    const idx=words.findIndex(w=>w.text===val);
    if(idx>=0){
      words.splice(idx,1);
      cleared++; document.getElementById('cleared').textContent=cleared;
      speed += 0.6;
    }
    input.value='';
  }
});

function startGame(){
  document.getElementById('overlay').style.display='none';
  reset(); running=true; input.disabled=false; input.value=''; input.focus();
  document.getElementById('msg').textContent='type each falling line exactly and hit ENTER before it reaches the firewall';
}
document.getElementById('startBtn').addEventListener('click', startGame);
window.addEventListener('keydown', e=>{
  if(!running && e.key==='Enter' && document.getElementById('overlay').style.display==='none'){
    startGame();
  }
});
requestAnimationFrame(loop);
</script>
</body>
</html>
