<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>GAME IDEA GEN v1.0</title>

    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    :root {
      --amber: #ffb000;
      --amber-dim: #7a5200;
      --bg: #0c0900;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    body::after {
      content: "";
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.72) 100%);
      pointer-events: none;
      z-index: 101;
    }

    .terminal {
      width: min(780px, 100vw);
      height: min(600px, 100vh);
      padding: 32px 36px 28px;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      color: var(--amber);
      display: flex;
      flex-direction: column;
      animation: flicker 8s infinite;
    }

    @keyframes flicker {
      0%,98%,100% { opacity:1 }
      98.5% { opacity:.93 }
      99%   { opacity:1 }
      99.4% { opacity:.97 }
    }

    .header {
      border-bottom: 1px solid var(--amber-dim);
      padding-bottom: 10px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .header-title { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; }
    .header-info  { font-size: 11px; color: var(--amber-dim); letter-spacing: .08em; }

    .rows {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
    }

    .row {
      display: grid;
      grid-template-columns: 160px 1fr;
      align-items: start;
      gap: 12px;
      opacity: 0.22;
      transition: opacity .2s;
    }

    .row.revealed { opacity: 1; }
    .row.current  { opacity: 0.55; }

    .row-label {
      font-size: 11px;
      letter-spacing: .18em;
      color: var(--amber-dim);
      text-transform: uppercase;
      padding-top: 1px;
    }

    .row-label span {
      display: block;
      font-size: 9px;
      letter-spacing: .1em;
      opacity: .65;
      margin-top: 3px;
      line-height: 1.4;
    }

    .row-value {
      font-size: 20px;
      line-height: 1.3;
      letter-spacing: .02em;
      min-height: 26px;
    }

    .row-value.rolling { color: var(--amber-dim); }

    .row-value.done {
      color: var(--amber);
      text-shadow: 0 0 12px rgba(255,176,0,0.5), 0 0 30px rgba(255,176,0,0.12);
    }

    .row-value.land { animation: land .12s ease 2; }

    @keyframes land {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.02); text-shadow: 0 0 20px rgba(255,176,0,0.9); }
      100% { transform: scale(1); }
    }

    .prompt-line {
      border-top: 1px solid var(--amber-dim);
      padding-top: 14px;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .prompt-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .prompt-left { font-size: 13px; color: var(--amber-dim); letter-spacing: .06em; }
    .prompt-left strong { color: var(--amber); }

    .btns { display: flex; gap: 8px; flex-wrap: wrap; }

    button {
      font-family: inherit;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      border: 1px solid var(--amber-dim);
      background: transparent;
      color: var(--amber-dim);
      padding: 7px 14px;
      cursor: pointer;
      transition: all .1s;
    }

    button.primary { border-color: var(--amber); color: var(--amber); }
    button.primary:hover { background: var(--amber); color: var(--bg); }
    button:hover { border-color: var(--amber); color: var(--amber); }
    button:active { opacity: .7; }
    button:disabled { opacity: .3; cursor: default; }

    /* POST button — green tint when active */
    button.post-btn {
      border-color: #2d6a2d;
      color: #2d6a2d;
      display: none;
    }

    button.post-btn.visible {
      display: inline-block;
      border-color: #39ff14;
      color: #39ff14;
    }

    button.post-btn.visible:hover {
      background: #39ff14;
      color: var(--bg);
    }

    button.post-btn.posted {
      display: inline-block;
      border-color: #1a7a1a;
      color: #1a7a1a;
      cursor: default;
    }

    .forum-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 28px;
    }

    .forum-status {
      font-size: 11px;
      letter-spacing: .1em;
      color: var(--amber-dim);
      flex: 1;
    }

    .forum-status.ok   { color: #39ff14; }
    .forum-status.err  { color: #ff4444; }

    .cursor {
      display: inline-block;
      width: 10px; height: 18px;
      background: var(--amber);
      vertical-align: middle;
      margin-left: 4px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    @media (max-width: 600px) {
      .terminal { padding: 20px 18px; height: 100vh; }
      .row { grid-template-columns: 110px 1fr; gap: 8px; }
      .row-value { font-size: 15px; }
    }
  </style>
</head>

  "Crafting RPG":"RPG","Loot and Craft":"RPG","Monster Tamer":"RPG","Creature Collector":"RPG",
  "Deckbuilder":"Strategy","Turn-Based Strategy":"Strategy","Real-Time Strategy":"Strategy",
  "Tactics":"Strategy","Grand Strategy":"Strategy","4X Strategy":"Strategy","Wargame":"Strategy",
  "Hexagonal Strategy":"Strategy","Tower Defense":"Strategy","Auto-battler":"Strategy",
  "Diplomacy Game":"Strategy","Political Sim":"Strategy","Negotiation Sim":"Strategy",
  "Puzzle":"Puzzle","Grid Puzzler":"Puzzle","Sokoban-like":"Puzzle","Physics Puzzler":"Puzzle",
  "Portal-like":"Puzzle","Time-Loop Puzzle":"Puzzle","Time-Manipulation Puzzle":"Puzzle",
  "Escape Room":"Puzzle","Hidden Object":"Puzzle","Brick Breaker":"Puzzle","Match-3":"Puzzle",
  "Breakout-like":"Puzzle","Marble Game":"Puzzle","Ball Roller":"Puzzle","Word Game":"Puzzle",
  "Typing Game":"Puzzle","Trivia Game":"Puzzle","Pinball":"Puzzle",
  "Survival Horror":"Horror","Horror Puzzle":"Horror",
  "Life Sim":"Simulation","Dating Sim":"Simulation","Farming Sim":"Simulation","Cooking Game":"Simulation",
  "Fishing Game":"Simulation","Gardening Sim":"Simulation","Aquarium Sim":"Simulation",
  "Pet Sim":"Simulation","Zoo Sim":"Simulation","Creature Sim":"Simulation","Job Sim":"Simulation",
  "Car Mechanic Sim":"Simulation","Blacksmith Sim":"Simulation","Potion Brewer":"Simulation",
  "Alchemy Sim":"Simulation","City Builder":"Simulation","Colony Sim":"Simulation",
  "Factory Builder":"Simulation","Management Sim":"Simulation","Hotel Management":"Simulation",
  "Hospital Management":"Simulation","Prison Management":"Simulation","Train Management":"Simulation",
  "Theme Park Sim":"Simulation","Traffic Sim":"Simulation","Ant Colony Sim":"Simulation",
  "Ecosystem Sim":"Simulation","Virus Sim":"Simulation","Plague Sim":"Simulation",
  "Climate Sim":"Simulation","Ecosystem Collapse Sim":"Simulation","God Game":"Simulation",
  "Physics Sandbox":"Simulation","Crowd Sim":"Simulation","Space Colony Sim":"Simulation",
  "Racing":"Sports","Kart Racer":"Sports","Drift Game":"Sports","Skateboarding":"Sports",
  "Snowboarding":"Sports","Parkour":"Sports","BMX Game":"Sports","Sports Management":"Sports",
  "Football Manager-like":"Sports","Betting Sim":"Sports"
};

function mapGenre(g) {
  return GENRE_MAP[g] || "Other";
}

const STAGES = [
  { key:"genre1",  label:"GENRE A",    hint:"first genre to mix",                   pool: GENRES_POOL },
  { key:"genre2",  label:"GENRE B",    hint:"second genre to blend with A",          pool: GENRES_POOL },
  { key:"rule",    label:"CORE RULE",  hint:"the one mechanic that defines play",    pool: RULES       },
  { key:"setting", label:"SETTING",    hint:"the world and place the game lives in", pool: SETTINGS    },
  { key:"theme",   label:"THEME",      hint:"the emotional core of the game",        pool: THEMES      }
];

const rowsEl      = document.getElementById("rows");
const nextBtn     = document.getElementById("nextBtn");
const newBtn      = document.getElementById("newBtn");
const copyBtn     = document.getElementById("copyBtn");
const postBtn     = document.getElementById("postBtn");
const promptMsg   = document.getElementById("promptMsg");
const countEl     = document.getElementById("countEl");
const forumStatus = document.getElementById("forumStatus");

let stage = 0, picked = {}, rolling = false, ideaCount = 0;
const recentKeys = [];

STAGES.forEach((s, i) => {
  const row = document.createElement("div");
  row.className = "row";
  row.id = "row" + i;
  row.innerHTML = `<div class="row-label">${s.label}<span>${s.hint}</span></div>
                   <div class="row-value" id="val${i}">—</div>`;
  rowsEl.appendChild(row);
});

function rand(pool, exclude = []) {
  const f = pool.filter(x => !exclude.includes(x));
  return f[Math.floor(Math.random() * f.length)];
}

function buildKey(p) {
  return [p.genre1,p.genre2,p.rule,p.setting,p.theme].join("|");
}

function rollFull() {
  let a, tries = 0;
  do {
    const g1 = rand(GENRES_POOL);
    a = { genre1:g1, genre2:rand(GENRES_POOL,[g1]), rule:rand(RULES), setting:rand(SETTINGS), theme:rand(THEMES) };
    tries++;
  } while (recentKeys.includes(buildKey(a)) && tries < 400);
  return a;
}

let queued = rollFull();

function reset() {
  stage = 0; picked = {};
  STAGES.forEach((_,i) => {
    document.getElementById("row"+i).className = "row" + (i===0?" current":"");
    const v = document.getElementById("val"+i);
    v.className = "row-value"; v.textContent = "—";
  });
  nextBtn.textContent = "REVEAL";
  nextBtn.disabled = false;
  setPrompt("PRESS REVEAL TO BEGIN");
  postBtn.className = "post-btn";
  forumStatus.textContent = "";
  forumStatus.className = "forum-status";
}

function setPrompt(msg) {
  promptMsg.innerHTML = `<strong>&gt;</strong> ${msg}<span class="cursor"></span>`;
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function reveal() {
  if (rolling || stage >= STAGES.length) return;
  rolling = true; nextBtn.disabled = true; newBtn.disabled = true;

  const i = stage, s = STAGES[i];
  const finalVal = queued[s.key];
  const valEl = document.getElementById("val"+i);
  const rowEl = document.getElementById("row"+i);

  valEl.className = "row-value rolling";
  rowEl.classList.add("revealed");

  const flashes = 10 + i * 3;
  const exclude = i===1 ? [queued.genre1] : [];

  for (let f = 0; f < flashes; f++) {
    valEl.textContent = rand(s.pool, exclude);
    await sleep(48 + f * 6);
  }

  valEl.textContent = finalVal;
  valEl.className = "row-value done land";
  setTimeout(() => valEl.classList.remove("land"), 300);
  rowEl.className = "row revealed";
  picked[s.key] = finalVal;
  stage++;

  if (stage < STAGES.length) {
    document.getElementById("row"+stage).classList.add("current");
    const hints = ["GENRE B IS NEXT","NOW THE CORE RULE","NOW CHOOSE A SETTING","FINAL PIECE — THE THEME"];
    setPrompt(hints[stage-1] || "PRESS REVEAL");
    nextBtn.textContent = "REVEAL NEXT";
  } else {
    recentKeys.unshift(buildKey(picked));
    if (recentKeys.length > 500) recentKeys.pop();
    queued = rollFull();
    ideaCount++;
    countEl.textContent = ideaCount + " IDEA" + (ideaCount===1?"":"S") + " GENERATED";
    nextBtn.textContent = "DONE";
    nextBtn.disabled = true;
    setPrompt("IDEA COMPLETE — POST IT OR ROLL A NEW ONE");
    postBtn.className = "post-btn visible";
    forumStatus.textContent = "READY TO POST → game_idea_forums.html";
    forumStatus.className = "forum-status";
  }

  rolling = false; newBtn.disabled = false;
  if (stage < STAGES.length) nextBtn.disabled = false;
}

function postToForum() {
  const title = `${picked.genre1} + ${picked.genre2}`;
  const description =
    `Genre Mix: ${picked.genre1} + ${picked.genre2}\n\n` +
    `Core Rule: ${picked.rule}\n\n` +
    `Setting: ${picked.setting}\n\n` +
    `Theme: ${picked.theme}`;

  const genre = mapGenre(picked.genre1);

  const payload = {
    id: Date.now().toString(),
    title,
    description,
    genre,
    upvotes: 0,
    downvotes: 0,
    score: 0,
    timestamp: Date.now()
  };

  try {
    const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    const url = `https://12leocheung.github.io/game-ideas-forum/#inject=${encoded}`;
    window.open(url, "_blank");

    postBtn.className = "post-btn posted";
    postBtn.textContent = "OPENED ✓";
    forumStatus.textContent = "FORUM OPENED — IDEA WILL AUTO-POST ON ARRIVAL";
    forumStatus.className = "forum-status ok";
  } catch(e) {
    forumStatus.textContent = "ERROR: FAILED TO ENCODE IDEA";
    forumStatus.className = "forum-status err";
  }
}

nextBtn.addEventListener("click", reveal);
postBtn.addEventListener("click", () => {
  if (postBtn.classList.contains("posted")) return;
  postToForum();
});
newBtn.addEventListener("click", () => { if(!rolling){ queued=rollFull(); reset(); } });
copyBtn.addEventListener("click", async () => {
  if (stage < STAGES.length) { setPrompt("FINISH THE REVEAL FIRST"); return; }
  const t = `GAME IDEA\nGenre A: ${picked.genre1}\nGenre B: ${picked.genre2}\nCore Rule: ${picked.rule}\nSetting: ${picked.setting}\nTheme: ${picked.theme}`;
  try { await navigator.clipboard.writeText(t); copyBtn.textContent="COPIED"; }
  catch { copyBtn.textContent="FAILED"; }
  setTimeout(()=>copyBtn.textContent="COPY", 900);
});

reset();
</script>
</body>
</html>
