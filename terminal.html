<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS-7 Terminal — CTF Sandbox</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
    :root {
        --crt-green: #33ff33;
        --crt-green-dim: #1a7a1a;
        --crt-green-faint: #0d3d0d;
        --crt-amber: #ffb000;
        --crt-red: #ff3333;
        --crt-cyan: #00ffff;
        --crt-white: #e8ffe8;
        --crt-bg: #050a05;
        --crt-surface: #070d07;
        --font-mono: 'Share Tech Mono', 'Courier New', monospace;
        --scanline-opacity: 0.04;
        --glow-green: 0 0 8px #33ff33, 0 0 16px #1a7a1a40;
        --glow-amber: 0 0 8px #ffb000, 0 0 16px #ffb00040;
    }
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    html,
    body {
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: var(--font-mono);
    }
    .monitor {
        width: 100vw;
        height: 100vh;
        background: radial-gradient(ellipse at center, #1a1a1a 0%, #0a0a0a 60%, #050505 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }
    .crt-screen {
        width: min(98vw, 1200px);
        height: min(96vh, 800px);
        background: var(--crt-bg);
        border-radius: 12px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 0 2px #1a2a1a, 0 0 0 4px #0d1a0d, 0 0 40px #33ff3330, inset 0 0 60px #000a;
    }
    .crt-screen::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 60%, #00000080 100%);
        pointer-events: none;
        z-index: 10;
        border-radius: inherit;
    }
    .crt-screen::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, var(--scanline-opacity)) 2px, rgba(0, 0, 0, var(--scanline-opacity)) 4px);
        pointer-events: none;
        z-index: 11;
        border-radius: inherit;
    }
    .phosphor-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 40%, #33ff3308 0%, transparent 70%);
        pointer-events: none;
        z-index: 9;
        animation: flicker 8s ease-in-out infinite;
    }
    @keyframes flicker {
        0%,
        100% {
            opacity: 1;
        }
        92% {
            opacity: 1;
        }
        93% {
            opacity: 0.85;
        }
        94% {
            opacity: 1;
        }
        96% {
            opacity: 0.9;
        }
        97% {
            opacity: 1;
        }
    }
    .titlebar {
        background: linear-gradient(90deg, #0d1a0d, #0f200f, #0d1a0d);
        border-bottom: 1px solid var(--crt-green-dim);
        padding: 6px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        color: var(--crt-green-dim);
        position: relative;
        z-index: 5;
        flex-wrap: wrap;
        gap: 4px;
    }
    .titlebar-left {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .titlebar-logo {
        color: var(--crt-green);
        font-size: 12px;
        letter-spacing: 3px;
        text-shadow: var(--glow-green);
    }
    .titlebar-status {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
    }
    .status-item {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 10px;
    }
    .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--crt-green);
        box-shadow: 0 0 4px var(--crt-green);
        animation: blink-dot 2s ease-in-out infinite;
    }
    .status-dot.amber {
        background: var(--crt-amber);
        box-shadow: 0 0 4px var(--crt-amber);
    }
    .status-dot.red {
        background: var(--crt-red);
        box-shadow: 0 0 4px var(--crt-red);
        animation: blink-dot 0.5s ease-in-out infinite;
    }
    @keyframes blink-dot {
        0%,
        100% {
            opacity: 1;
        }
        50% {
            opacity: 0.3;
        }
    }
    .terminal-wrapper {
        height: calc(100% - 35px);
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 5;
    }
    .output-area {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px 4px;
        font-size: 13px;
        line-height: 1.55;
        color: var(--crt-green);
        scrollbar-width: thin;
        scrollbar-color: var(--crt-green-dim) transparent;
    }
    .output-area::-webkit-scrollbar {
        width: 4px;
    }
    .output-area::-webkit-scrollbar-track {
        background: transparent;
    }
    .output-area::-webkit-scrollbar-thumb {
        background: var(--crt-green-dim);
        border-radius: 2px;
    }
    .line {
        white-space: pre-wrap;
        word-break: break-all;
    }
    .line.prompt {
        color: var(--crt-green);
    }
    .line.cmd {
        color: var(--crt-white);
    }
    .line.output {
        color: var(--crt-green);
    }
    .line.error {
        color: var(--crt-red);
        text-shadow: 0 0 6px var(--crt-red);
    }
    .line.warning {
        color: var(--crt-amber);
        text-shadow: 0 0 4px var(--crt-amber);
    }
    .line.info {
        color: var(--crt-cyan);
        text-shadow: 0 0 4px #00ffff60;
    }
    .line.success {
        color: #00ff88;
        text-shadow: 0 0 6px #00ff8860;
    }
    .line.dim {
        color: var(--crt-green-dim);
    }
    .line.flag {
        color: #ffff00;
        text-shadow: 0 0 8px #ffff00, 0 0 16px #ffff0060;
        font-weight: bold;
        animation: flag-glow 1s ease-in-out infinite;
    }
    .line.ascii {
        color: var(--crt-green);
        text-shadow: 0 0 3px var(--crt-green-dim);
        font-size: 11px;
        line-height: 1.3;
    }
    .line.header {
        color: var(--crt-green);
        text-shadow: var(--glow-green);
    }
    @keyframes flag-glow {
        0%,
        100% {
            text-shadow: 0 0 8px #ffff00, 0 0 16px #ffff0060;
        }
        50% {
            text-shadow: 0 0 12px #ffff00, 0 0 24px #ffff00, 0 0 40px #ffff0040;
        }
    }
    .input-line {
        display: flex;
        align-items: center;
        padding: 8px 16px 10px;
        border-top: 1px solid var(--crt-green-faint);
        gap: 6px;
        background: #00000060;
    }
    .prompt-label {
        color: var(--crt-green);
        text-shadow: var(--glow-green);
        font-size: 13px;
        white-space: nowrap;
        flex-shrink: 0;
        user-select: none;
    }
    .prompt-label span.user {
        color: #00ff88;
    }
    .prompt-label span.host {
        color: var(--crt-cyan);
    }
    .prompt-label span.path {
        color: var(--crt-amber);
    }
    #cmd-input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--crt-white);
        font-family: var(--font-mono);
        font-size: 13px;
        caret-color: var(--crt-green);
        text-shadow: 0 0 4px var(--crt-white);
    }
    .cursor-blink {
        display: inline-block;
        width: 8px;
        height: 14px;
        background: var(--crt-green);
        vertical-align: middle;
        margin-left: 2px;
        animation: cursor-blink 1s step-end infinite;
        box-shadow: var(--glow-green);
    }
    @keyframes cursor-blink {
        0%,
        100% {
            opacity: 1;
        }
        50% {
            opacity: 0;
        }
    }
    @keyframes typewriter {
        from {
            width: 0;
        }
        to {
            width: 100%;
        }
    }
    .typing-line {
        overflow: hidden;
        white-space: nowrap;
        animation: typewriter 0.5s steps(40) forwards;
    }
    #boot-screen {
        position: absolute;
        inset: 0;
        background: var(--crt-bg);
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font-size: 12px;
        color: var(--crt-green);
        padding: 20px;
    }
    .boot-line {
        opacity: 0;
        animation: boot-appear 0.1s forwards;
    }
    @keyframes boot-appear {
        to {
            opacity: 1;
        }
    }
    .progress-container {
        width: 400px;
        max-width: 90%;
        margin-top: 8px;
    }
    .progress-bar-bg {
        height: 8px;
        background: var(--crt-green-faint);
        border: 1px solid var(--crt-green-dim);
        border-radius: 2px;
        overflow: hidden;
    }
    .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: var(--crt-green);
        box-shadow: var(--glow-green);
        transition: width 0.1s;
        border-radius: 1px;
    }
    .modal-overlay {
        display: none;
        position: absolute;
        inset: 0;
        background: #000000aa;
        z-index: 30;
        align-items: center;
        justify-content: center;
    }
    .modal-overlay.active {
        display: flex;
    }
    .modal-box {
        background: #050f05;
        border: 2px solid #ffff00;
        box-shadow: 0 0 30px #ffff0040;
        padding: 30px 40px;
        text-align: center;
        max-width: 500px;
        border-radius: 4px;
    }
    .modal-box h2 {
        color: #ffff00;
        font-size: 20px;
        margin-bottom: 16px;
        letter-spacing: 4px;
    }
    .modal-box p {
        color: var(--crt-green);
        line-height: 1.8;
        font-size: 13px;
    }
    .modal-close {
        margin-top: 20px;
        background: transparent;
        border: 1px solid var(--crt-green);
        color: var(--crt-green);
        font-family: var(--font-mono);
        padding: 8px 24px;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s;
    }
    .modal-close:hover {
        background: var(--crt-green);
        color: #000;
    }
</style>

                    else positional.push(args[i]);

                fileArg = positional[1];
                if (!pattern) { println('grep: missing pattern', 'error'); return; }
                if (!fileArg) { println('grep: missing file argument', 'error'); return; }

                    const node = getNode(path);

                    if (node.perm === 'denied' && !IS_ROOT) return;
                    const lines = node.content.split('\n');

                if (!node) { println(`grep: ${fileArg}: No such file or directory`, 'error'); return; }

                if (recursive && node.type === 'dir') {
                    const recurse = (p) => {
                        const n = getNode(p);
                        if (!n) return;
                        if (n.type === 'file') searchFile(p, p.split('/').pop());
                        else if (n.type === 'dir') {

                    };
                    recurse(targetPath);

        function processCommand(raw) {
            const trimmed = raw.trim();
            if (!trimmed) return;

            CMD_HISTORY.push(trimmed);
            HIST_IDX = CMD_HISTORY.length;

            printPromptLine(trimmed);

            const parts = trimmed.split(/\s+/);
            const cmd = parts[0].toLowerCase();
            const args = parts.slice(1);

            if (COMMANDS[cmd]) {
                COMMANDS[cmd](args);
            } else {
                const path = resolvePath(cmd);
                const node = getNode(path);
                if (node && node.type === 'file') {
                    println(`${cmd}: Permission denied (not executable as guest)`, 'error');
                } else {
                    println(`${cmd}: command not found. Type "help" for available commands.`,
                        'error');
                }
            }

            println('');
        }

        // ==================== INPUT HANDLING ====================
        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = cmdInput.value;
                cmdInput.value = '';
                processCommand(cmd);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (HIST_IDX > 0) { HIST_IDX--;
                    cmdInput.value = CMD_HISTORY[HIST_IDX]; }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (HIST_IDX < CMD_HISTORY.length - 1) { HIST_IDX++;
                    cmdInput.value = CMD_HISTORY[HIST_IDX]; } else { HIST_IDX = CMD_HISTORY.length;
                    cmdInput.value = ''; }
            } else if (e.key === 'Tab') {
                e.preventDefault();
                autocomplete();
            } else if (e.key === 'l' && e.ctrlKey) {
                e.preventDefault();
                COMMANDS.clear();
            } else if (e.key === 'c' && e.ctrlKey) {
                e.preventDefault();
                printPromptLine(cmdInput.value + '^C');
                cmdInput.value = '';
                println('');
            }
        });

        function autocomplete() {
            const val = cmdInput.value;
            const parts = val.split(/\s+/);
            if (parts.length < 2) return;
            const partial = parts[parts.length - 1];
            const base = partial.includes('/') ? partial.substring(0, partial.lastIndexOf('/') + 1) : '';
            const search = partial.includes('/') ? partial.substring(partial.lastIndexOf('/') + 1) :
                partial;
            const dir = base ? resolvePath(base) : CWD;
            const node = getNode(dir);
            if (!node || node.type !== 'dir') return;
            const matches = (node.children || []).filter(c => c.startsWith(search));
            if (matches.length === 1) {
                parts[parts.length - 1] = base + matches[0];
                const childPath = (dir === '/' ? '/' + matches[0] : dir + '/' + matches[0]);
                const child = getNode(childPath);
                if (child && child.type === 'dir') parts[parts.length - 1] += '/';
                cmdInput.value = parts.join(' ');
            } else if (matches.length > 1) {
                println('');
                printPromptLine(val);
                println(matches.join('  '), 'dim');
            }
        }

        // Click anywhere to focus input
        document.querySelector('.crt-screen').addEventListener('click', (e) => {

                cls: 'ascii' },
            { text: '  ██║ ╚████║███████╗██╔╝ ██╗╚██████╔╝███████║         ██║  ', delay: 250,
                cls: 'ascii' },
            { text: '  ╚═╝  ╚═══╝╚══════╝╚═╝  ╚═╝ ╚═════╝ ╚══════╝         ╚═╝  ', delay: 300,
                cls: 'ascii' },
            { text: '', delay: 350 },
            { text: '  NEXUS Research Terminal  v7.3.1  [RESTRICTED ACCESS]', delay: 400,
            cls: 'header' },

            cls: 'dim' },

            { text: '  [ OK ] Network interface: eth0 (192.168.1.10)', delay: 950,
            cls: 'success' },
            { text: '  [ OK ] Crypto module: AES-256-CBC active', delay: 1050, cls: 'success' },
            { text: '  [ OK ] Virtual filesystem: 10 flags hidden', delay: 1150, cls: 'success' },
            { text: '  [WARN] Intrusion attempt logged from 45.33.32.156', delay: 1250,
                cls: 'warning' },
            { text: '  [WARN] Unauthorized root login detected — audit in progress', delay: 1350,
                cls: 'warning' },
            { text: '', delay: 1450 },
            { text: '  Loading user session: guest@nexus7...', delay: 1550 },
            { text: '  Type "tutorial" for a quick start guide.', delay: 1600, cls: 'dim' },
            { text: '', delay: 1700 },
        ];

        let bootIdx = 0;

        function runBoot() {
            if (bootIdx >= bootLines.length) {
                showProgressBar();
                return;
            }
            const line = bootLines[bootIdx++];
            const div = document.createElement('div');
            div.style.animationDelay = '0s';
            div.className = 'boot-line line ' + (line.cls || 'output');
            div.textContent = line.text;
            bootScreen.appendChild(div);
            div.style.animation = 'boot-appear 0.05s forwards';
            setTimeout(runBoot, 80);
        }

        function showProgressBar() {
            const container = document.createElement('div');
            container.className = 'progress-container boot-line';
            container.style.animation = 'boot-appear 0.05s forwards';
            container.innerHTML = `
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:11px;color:#1a7a1a">
          <span>LOADING TERMINAL</span><span id="pct">0%</span>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="pbar"></div></div>
      `;
            bootScreen.appendChild(container);

            let pct = 0;
            const interval = setInterval(() => {
                pct += Math.random() * 15 + 5;
                if (pct >= 100) { pct = 100;
                    clearInterval(interval);
                    transitionToTerminal(); }
                document.getElementById('pbar').style.width = pct + '%';
                document.getElementById('pct').textContent = Math.floor(pct) + '%';
            }, 80);
        }

        function transitionToTerminal() {
            setTimeout(() => {
                bootScreen.style.transition = 'opacity 0.4s';
                bootScreen.style.opacity = '0';
                setTimeout(() => {
                    bootScreen.style.display = 'none';

                    cmdInput.focus();

        }

                'dim');

            println('   • Type "status" for a full progress report', 'dim');
            println('');
            println(' First tip: try "ls -la" and "cat welcome.txt"', 'dim');
            println('');
            updatePrompt();
            updateFlagCounter();
        }

        // Start boot
        setTimeout(runBoot, 300);
